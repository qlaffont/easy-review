<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Closed pull request">
  <!-- Solid tile so the status reads at 16px; colors match the pull request state badges -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#e11d48"/>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(4 4)"
  >
    <!-- Lucide git-pull-request-closed glyph -->
    <circle cx="6" cy="6" r="3"/>
    <path d="M6 9v12"/>
    <path d="m21 3-6 6"/>
    <path d="m21 9-6-6"/>
    <path d="M18 11.5V15"/>
    <circle cx="18" cy="18" r="3"/>
  </g>
</svg>
