<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Draft pull request">
  <!-- Solid tile so the status reads at 16px; colors match the pull request state badges -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#64748b"/>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(4 4)"
  >
    <!-- Lucide git-pull-request-draft glyph -->
    <circle cx="18" cy="18" r="3"/>
    <circle cx="6" cy="6" r="3"/>
    <path d="M18 6V5"/>
    <path d="M18 11v-1"/>
    <line x1="6" x2="6" y1="9" y2="21"/>
  </g>
</svg>
