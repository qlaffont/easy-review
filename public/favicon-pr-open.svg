<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Open pull request">
  <!-- Solid tile so the status reads at 16px; colors match the pull request state badges -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#059669"/>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(4 4)"
  >
    <!-- Lucide git-pull-request glyph -->
    <circle cx="18" cy="18" r="3"/>
    <circle cx="6" cy="6" r="3"/>
    <path d="M13 6h3a2 2 0 0 1 2 2v7"/>
    <line x1="6" x2="6" y1="9" y2="21"/>
  </g>
</svg>
